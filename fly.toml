# fly.toml app configuration file generated for spotifydownloader on 2026-11-11T16:16:31+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'spotifydownloader'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/platforms"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"